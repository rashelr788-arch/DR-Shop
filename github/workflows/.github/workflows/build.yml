name: Build DR Shop Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare DR Shop
        run: |
          mkdir -p www
          cp index.html www/

          if [ -f manifest.json ]; then
            cp manifest.json www/
          fi

          if [ -f service-worker.js ]; then
            cp service-worker.js www/
          fi

          for folder in assets images img; do
            if [ -d "$folder" ]; then
              cp -R "$folder" www/
            fi
          done

          cat > package.json <<'EOF'
          {
            "name": "dr-shop",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.2.1",
              "@capacitor/android": "^6.2.1"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.2.1"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.rashelr788.drshop",
            "appName": "DR Shop",
            "webDir": "www"
          }
          EOF

          npm install
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: DR-Shop-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
