<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DR Shop</title><style>
body{font-family:Arial;margin:0;background:#f7f3ef;color:#30221d}header{background:#4b2922;color:white;padding:18px}main{padding:16px;max-width:900px;margin:auto}button{background:#9f2929;color:white;border:0;padding:10px;border-radius:8px;margin:4px}input{padding:11px;margin:6px 0;width:95%;border:1px solid #ccc;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card{background:white;padding:12px;border-radius:10px}.card img{width:100%;height:110px;object-fit:cover}.price{color:#9f2929;font-weight:bold}.hide{display:none}</style></head><body>
<header><h1>DR Shop</h1>বাংলাদেশের অনলাইন মার্কেটপ্লেস</header><main>
<nav><button onclick="page('home')">হোম</button><button onclick="page('cart')">কার্ট (<span id="count">0</span>)</button><button onclick="page('seller')">বিক্রেতা</button><button onclick="page('admin')">অ্যাডমিন ডেমো</button></nav>
<section id="home"><h2>স্বাগতম</h2><input id="search" placeholder="পণ্য খুঁজুন" oninput="draw()"><div id="items" class="grid"></div></section>
<section id="cart" class="hide"><h2>কার্ট</h2><div id="cartlist"></div><h3 id="sum"></h3><input id="name" placeholder="আপনার নাম"><input id="phone" placeholder="বাংলাদেশি মোবাইল 01XXXXXXXXX"><input id="addr" placeholder="ঠিকানা"><button onclick="checkout()">ডেমো অর্ডার দিন</button></section>
<section id="seller" class="hide"><h2>পণ্য যোগ করুন (ডেমো)</h2><input id="pn" placeholder="পণ্যের নাম"><input id="pp" type="number" placeholder="দাম"><input id="pi" placeholder="ছবির URL ঐচ্ছিক"><button onclick="add()">যোগ করুন</button></section>
<section id="admin" class="hide"><h2>অ্যাডমিন ডেমো</h2><p>পণ্য: <b id="pc"></b></p><p>ডেমো অর্ডার: <b id="oc"></b></p><p>এখানে নিরাপদ লগইন নেই।</p></section>
<p><small>নোট: এটি পরীক্ষামূলক ডেমো। বাস্তব পেমেন্ট, নিরাপদ লগইন বা সার্ভার ডেটাবেস নেই।</small></p></main>
<script>
let ps=[{n:"টি-শার্ট",v:450,i:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400"},{n:"ব্যাগ",v:650,i:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400"},{n:"ঘড়ি",v:900,i:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400"}],cart=[],orders=0;
function page(x){["home","cart","seller","admin"].forEach(k=>document.getElementById(k).classList.toggle("hide",k!==x));if(x==="cart")cartView();stats()}
function draw(){let q=(search.value||"").toLowerCase();items.innerHTML=ps.filter(p=>p.n.toLowerCase().includes(q)).map((p,j)=>`<div class="card"><img src="${p.i}"><h3>${p.n}</h3><p class="price">৳${p.v}</p><button onclick="cart.push(${ps.indexOf(p)});count.textContent=cart.length">কার্টে যোগ</button></div>`).join("")}
function cartView(){cartlist.innerHTML=cart.map(i=>ps[i].n+" — ৳"+ps[i].v).join("<br>")||"কার্ট খালি";sum.textContent="মোট: ৳"+cart.reduce((s,i)=>s+ps[i].v,0)}
function checkout(){if(!cart.length||!name.value.trim()||!/^01[0-9]{9}$/.test(phone.value)||!addr.value.trim()){alert("নাম, সঠিক বাংলাদেশি নম্বর, ঠিকানা ও কার্ট পূরণ করুন");return}orders++;cart=[];count.textContent=0;cartView();alert("ডেমো অর্ডার সম্পন্ন");stats()}
function add(){let n=pn.value.trim(),v=+pp.value;if(!n||v<=0){alert("পণ্যের নাম ও দাম দিন");return}ps.push({n,v,i:pi.value||"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400"});draw();stats();alert("পণ্য যোগ হয়েছে")}
function stats(){pc.textContent=ps.length;oc.textContent=orders}draw();stats();
</script></body></html>
